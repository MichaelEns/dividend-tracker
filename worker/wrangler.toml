name = "divtracker-plaid"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Every extra hostname is another way to reach a worker that holds a brokerage
# access token. The origin and passphrase gates apply there too, but a
# per-version preview URL buys nothing here and is one more thing to remember.
preview_urls = false

# Configure via `wrangler secret put`:
#   PLAID_CLIENT_ID
#   PLAID_SECRET
#   PLAID_ENV                (sandbox | development | production; default: production)
#   ALLOWED_ORIGINS          (comma-separated, e.g. https://<you>.github.io)
#   SYNC_PASSPHRASE          (long random string; REQUIRED - endpoints fail closed without it)
#
# Optionally, a SECOND Plaid developer account used only by the balances app.
# Each free Trial account grants 10 Production Items for the lifetime of the
# account, so a second account gives balances its own budget: re-linking a
# flaky Canadian bank then cannot consume slots the brokerage needs. It also
# lets one app stay on sandbox while the other runs against real banks.
#
# Set the client id and secret TOGETHER or not at all. A Plaid secret belongs to
# one account and one environment, so a half-configured pair authenticates as
# neither account - the worker refuses to start a link rather than let Plaid
# report that as an ordinary bank-credentials error.
#   PLAID_BALANCE_CLIENT_ID
#   PLAID_BALANCE_SECRET
#   PLAID_BALANCE_ENV        (defaults to PLAID_ENV)
#
# Optional alternative provider. SnapTrade Personal is free and has no
# equivalent of Plaid's 10-Items-for-the-lifetime-of-the-account cap. Configure
# either provider, or both; the page shows whichever the worker reports.
#   SNAPTRADE_CLIENT_ID      (Personal client ID from the SnapTrade dashboard)
#   SNAPTRADE_CONSUMER_KEY   (Personal consumer key; signs every request)
#
# No public/secret values live in this file.
#
# Token storage. Plaid's free Trial plan allows 10 Production Items for the
# lifetime of the account and does NOT refund a slot when an Item is removed,
# so re-linking on every sync would exhaust it after ten syncs. Binding this
# namespace lets the worker link once and refresh through the stored token
# indefinitely. Create it with:
#
#   wrangler kv namespace create TOKENS
#
# then paste the printed id below and uncomment the block. Without it the
# worker still works, but falls back to one-off remove-after-read.

[[kv_namespaces]]
binding = "TOKENS"
id = "51d8fcb24b6d44e7b4e980a25e532a89"

[vars]
PLAID_PRODUCTS = "investments"
PLAID_COUNTRY_CODES = "US"
# The balances page links Canadian retail banks, which have no investments
# product. Asking for one does not merely return less: it hides TD Canada Trust
# from Link's institution search entirely, so the bank looks unsupported.
#
# `transactions` rather than the bare minimum, deliberately. Only /accounts/
# balance/get is called today, but a product cannot be added to an existing Item
# without sending the user back through Link and its MFA - the step that already
# fails at two of the four banks here. Consent asked for at link time is free;
# consent asked for later may be unobtainable.
#
# Whatever goes in this list FILTERS Link's account picker: only accounts
# supporting every named product are offered. So it may contain only products
# that every account type supports. Anything narrower belongs below.
PLAID_BALANCE_PRODUCTS = "transactions"
#
# Initialised where the institution and account support it, and ignored where
# they do not, WITHOUT filtering the account picker. `liabilities` is credit-only
# - naming it above would hide every chequing account - and it carries the
# statement due date, minimum payment and APR, which is the missing half of a
# credit card balance. `assets` is rejected here by Plaid outright.
PLAID_BALANCE_OPTIONAL_PRODUCTS = "liabilities"
PLAID_BALANCE_COUNTRY_CODES = "CA"
PLAID_CLIENT_NAME = "Dividend Tracker"
# Shown on the bank's own consent screen while the user decides whether to hand
# over their banking login, so it names the app that is actually asking.
PLAID_BALANCE_CLIENT_NAME = "Bank Balances"
