name = "divtracker-plaid"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Configure via `wrangler secret put`:
#   PLAID_CLIENT_ID
#   PLAID_SECRET
#   PLAID_ENV                (sandbox | development | production; default: production)
#   ALLOWED_ORIGINS          (comma-separated, e.g. https://<you>.github.io)
#   SYNC_PASSPHRASE          (long random string; REQUIRED - endpoints fail closed without it)
#
# Optional alternative provider. SnapTrade Personal is free and has no
# equivalent of Plaid's 10-Items-for-the-lifetime-of-the-account cap. Configure
# either provider, or both; the page shows whichever the worker reports.
#   SNAPTRADE_CLIENT_ID      (Personal client ID from the SnapTrade dashboard)
#   SNAPTRADE_CONSUMER_KEY   (Personal consumer key; signs every request)
#
# No public/secret values live in this file.
#
# Token storage. Plaid's free Trial plan allows 10 Production Items for the
# lifetime of the account and does NOT refund a slot when an Item is removed,
# so re-linking on every sync would exhaust it after ten syncs. Binding this
# namespace lets the worker link once and refresh through the stored token
# indefinitely. Create it with:
#
#   wrangler kv namespace create TOKENS
#
# then paste the printed id below and uncomment the block. Without it the
# worker still works, but falls back to one-off remove-after-read.
#
# [[kv_namespaces]]
# binding = "TOKENS"
# id = "<paste-the-id-from-wrangler-kv-namespace-create>"

[vars]
PLAID_PRODUCTS = "investments"
PLAID_COUNTRY_CODES = "US"
PLAID_CLIENT_NAME = "Dividend Tracker"
